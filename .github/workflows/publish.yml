name: Publish explicitly prepared artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing the accepted prepared artifact
        required: true
      artifact_name:
        description: Artifact with ZIPs, release_manifest.json, native-build-report.json and publish_plan.json
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: prepared
      - name: Publish accepted prepared files with explicit future release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py --packages prepared --plan prepared/publish_plan.json --publish
