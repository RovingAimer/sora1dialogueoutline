name: Build native source

on:
  workflow_dispatch:
  push:
    tags: ['initial-*', 'v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone core and optional ASI
        run: python build.py --asi
      - name: Build optional integrated loader from locked source
        run: python integration/build_loader.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ github.sha }}
          path: |
            build/DialogueOutline.dll
            build/DialogueOutline.asi
            build/core_report.json
            build/optional_loader/xinput1_4.dll
            build/optional_loader/report.json
          if-no-files-found: error
